services:
  - type: web
    name: majed-whatsapp-bot
    runtime: node
    # انشر من main — فرع cursor/import-whatsapp-bot-66cf قديم وبدون أزرار إيقاف الرد
    branch: main
    # free ينام بعد الخمول ويكسر Webhook واتساب — starter يبقى شغال
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node cloud.js
    healthCheckPath: /api/health
    envVars:
      - key: CLOUD
        value: "1"
      - key: ADMIN_HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: INTERAKT_SEND_MODE
        value: auto
      - key: INTERAKT_REPLY_TEMPLATE
        value: bot_reply
      - key: INTERAKT_REPLY_LANGUAGE
        value: ar
      - key: INTERAKT_COUNTRY_CODE
        value: "+966"
      - key: INTERAKT_API_KEY
        sync: false
      - key: INTERAKT_WEBHOOK_SECRET
        sync: false
      - key: OWNER_CONTROL_PHONES
        sync: false
      - key: HUMAN_TAKEOVER_ON_REPLY
        value: "1"
      - key: META_WA_VERIFY_TOKEN
        value: majed_verify
      - key: META_APP_SECRET
        sync: false
      - key: CUSTOMERS_DATA_DIR
        sync: false
